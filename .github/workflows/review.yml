name: Answer a Telegram command

# The Worker sends the older one-word replies here: list, publish <id>, drop <id>.
# Decisions now live on the preview card, so this lists what is waiting and says
# exactly what to reply. It also records `why` answers (a tap on the question the
# bot asks after disapprove or redo all) into docs/craft-watchlist.md.
on:
  workflow_dispatch:
    inputs:
      decision:
        description: "What you asked for"
        required: true
        default: list
        type: choice
        options: [list, publish, drop, why]
      slug:
        description: "Which post (optional)"
        required: false
        type: string
      request_id:
        description: "Telegram delivery id (leave blank)"
        required: false
        type: string
      note:
        description: "For why: the reason code or your words"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: suresilly-state
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_WINDOW_URL: ${{ vars.REVIEW_WINDOW_URL }}
      REVIEW_WINDOW_SECRET: ${{ secrets.REVIEW_WINDOW_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      # The note is the owner's own words. It goes through an environment
      # variable, never into the command line, so a quote mark cannot break out.
      - id: answer
        env:
          NOTE: ${{ inputs.note }}
        run: python -m suresilly.run legacy --decision "${{ inputs.decision }}" --slug "${{ inputs.slug }}" --note "$NOTE"

      - name: Keep the watchlist
        if: steps.answer.outputs.changed == 'true'
        run: |
          git config user.name suresilly-bot
          git config user.email bot@suresilly.local
          git add docs/craft-watchlist.md
          git diff --staged --quiet || git commit -m "why: one more line on the watchlist [skip ci]"
          git pull --rebase --quiet
          git push
