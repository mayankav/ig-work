name: Make a post

# The clock is the Cloudflare Worker in ops/dispatch-worker. It dispatches this at
# 08:00 and 20:00 IST with mode=publish. There is deliberately no `schedule:` here:
# GitHub's own cron runs late or not at all.
#
# publish  write + draw → preview on Telegram → posts after `approve`, or by itself after 1 hour
# force    the same preview, but it waits for your reply (no timer)
# build    write + draw only; the post is kept as a run artifact
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = Telegram preview (posts after approve or 1 hour) · force = preview that waits · build = just make it"
        required: false
        default: build
        type: choice
        options: [build, publish, force]
      slot_id:
        description: "Posting slot from the clock (leave blank)"
        required: false
        type: string
      request_id:
        description: "Delivery id from the clock or Telegram (leave blank)"
        required: false
        type: string
      retry:
        description: "Make a new post even if this slot already has one"
        required: false
        default: false
        type: boolean
      recover:
        description: "Older name for retry, kept so old dispatches still validate"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: suresilly-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'build' }}
      SS_HALT: ${{ vars.SS_HALT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      REVIEW_WINDOW_URL: ${{ vars.REVIEW_WINDOW_URL }}
      REVIEW_WINDOW_SECRET: ${{ secrets.REVIEW_WINDOW_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Write and draw the post
        id: build
        run: >
          python -m suresilly.run build --slot "${{ inputs.slot_id }}"
          ${{ (inputs.retry || inputs.recover || inputs.mode == 'force' || inputs.slot_id == '') && '--new' || '' }}

      - name: Freeze it for review
        id: stage
        if: steps.build.outputs.slug != '' && env.MODE != 'build'
        run: python -m suresilly.run stage --post "posts/${{ steps.build.outputs.slug }}"

      - name: Keep the exact post for your reply
        if: steps.stage.outputs.review_token != ''
        uses: actions/upload-artifact@v4
        with:
          name: review-deck
          path: posts/${{ steps.build.outputs.slug }}/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Put the preview images online
        if: steps.stage.outputs.review_token != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.stage.outputs.host_dir }}
          destination_dir: slides/${{ steps.build.outputs.slug }}/reviews/${{ steps.stage.outputs.review_token }}
          keep_files: true
          cname: media.suresilly.com

      - name: Send the preview to Telegram
        id: register
        if: steps.stage.outputs.review_token != ''
        run: python -m suresilly.run register --post "posts/${{ steps.build.outputs.slug }}" ${{ env.MODE == 'force' && '--manual' || '' }}

      - name: Keep a build-only post as an artifact
        if: steps.build.outputs.slug != '' && env.MODE == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ steps.build.outputs.slug }}
          path: posts/${{ steps.build.outputs.slug }}/
          retention-days: 7

      - name: Save the post record
        if: always() && steps.build.outputs.slug != '' && env.MODE != 'build'
        run: |
          git config user.name suresilly-bot
          git config user.email bot@suresilly.local
          git add posts state
          git diff --staged --quiet || git commit -m "auto: post ${{ steps.build.outputs.slug }} [skip ci]"
          git pull --rebase --quiet
          git push

      - name: Fetch the image host
        if: steps.stage.outputs.review_token != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Clear hosted images older than 14 days
        if: steps.stage.outputs.review_token != ''
        continue-on-error: true
        run: |
          python -m suresilly.run prune --root gh-pages/slides --days 14
          cd gh-pages
          git config user.name suresilly-bot
          git config user.email bot@suresilly.local
          git add -A
          git diff --staged --quiet || { git commit -m "prune: images older than 14 days"; git push; }

      - name: Keep the Instagram and Threads tokens alive
        if: always()
        continue-on-error: true
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python -m suresilly.run tokens

      - name: Tell the owner it didn't work
        if: failure() || cancelled()
        env:
          FAILURE_REASON: ${{ steps.build.outputs.reason || steps.stage.outputs.reason || steps.register.outputs.reason }}
          JOB_STATUS: ${{ job.status }}
        run: |
          pip install --quiet requests
          python -m suresilly.run notify-failure --slot "${{ inputs.slot_id }}"
