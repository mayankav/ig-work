name: Answer a Telegram command

# The Worker sends the older one-word replies here: list, publish <id>, drop <id>.
# Decisions now live on the preview card, so this lists what is waiting and says
# exactly what to reply.
on:
  workflow_dispatch:
    inputs:
      decision:
        description: "What you asked for"
        required: true
        default: list
        type: choice
        options: [list, publish, drop]
      slug:
        description: "Which post (optional)"
        required: false
        type: string
      request_id:
        description: "Telegram delivery id (leave blank)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_WINDOW_URL: ${{ vars.REVIEW_WINDOW_URL }}
      REVIEW_WINDOW_SECRET: ${{ secrets.REVIEW_WINDOW_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - run: python -m suresilly.run legacy --decision "${{ inputs.decision }}" --slug "${{ inputs.slug }}"
