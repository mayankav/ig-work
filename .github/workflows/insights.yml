name: insights

# Its own job, on its own cron, deliberately.
#
# This reads how published decks performed. It is not part of publishing and
# must never be able to affect it: it is not called from run.py, it is not a
# step in auto-post.yml, and it shares no state with either. If this job goes
# red for a week, posting still runs independently.
#
# The reverse also holds, and matters more. Nothing here writes anything the
# pipeline reads. state/insights.jsonl is a ledger for a person — see the
# docstring in scripts/insights.py — and AGENTS.md invariant 11 says the rules
# decide what ships. A performance number must never reach a gate.
on:
  schedule:
    # Hourly collection targets the 72–73-hour window. Late scheduler runs
    # retain the actual age and are excluded from same-age comparisons.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "How old a deck must be before we ask (days)"
        required: false
        default: "3"
        type: string
      dry_run:
        description: "List what is due and call nothing"
        required: false
        default: false
        type: boolean
      check_token:
        description: "Only prove the token works and has the insights permission"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: suresilly-state
  cancel-in-progress: false

jobs:
  collect:
    # The same kill switch as posting. Throwing it should stop everything that
    # talks to Instagram on this account's behalf, reads included.
    if: vars.SS_HALT != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only requests. Nothing in this job builds, renders or writes a deck, so
      # none of the skill's dependencies are needed.
      - name: Install
        run: pip install --quiet requests

      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # --check-token is the answer to "is the secret in this repo the right
          # string, and does it carry the permission?". The ordinary run cannot
          # say: it only looks at decks that already hold a media id, so on a
          # fresh install it makes no call at all and reports success.
          if [ "${{ inputs.check_token }}" = "true" ]; then
            python scripts/insights.py --check-token
          else
            python scripts/insights.py \
              --min-age-days "${{ inputs.min_age_days || '3' }}" \
              ${{ inputs.dry_run && '--dry-run' || '' }}
          fi

      - name: Show same-age results
        if: always()
        run: python scripts/insights_report.py >> "$GITHUB_STEP_SUMMARY"

      # always(), because insights.py appends each reading the moment it has it.
      # A run that collected three decks and then hit an error still has three
      # readings worth keeping, and a failed run wrote nothing so this is a
      # no-op.
      - name: Record what was measured
        if: always()
        run: |
          git config user.name "suresilly-bot"
          git config user.email "bot@suresilly.com"
          if [ -e state/insights.jsonl ]; then
            git add state/insights.jsonl
          fi
          if ! git diff --staged --quiet; then
            git commit -m "auto: insights [skip ci]"
          fi
          git pull --rebase --quiet
          git push

      - name: Keep unsaved measurements
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: insights-records-${{ github.run_id }}
          path: state/insights.jsonl
