name: Act on your reply

# Dispatched by the Worker's review window when you reply to a preview card
# (approve / disapprove / redo all / redo images 2,4) or when its hour runs out.
on:
  workflow_dispatch:
    inputs:
      token:
        required: true
        type: string
      action_id:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: suresilly-state
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SS_HALT: ${{ vars.SS_HALT }}
      REVIEW_TOKEN: ${{ inputs.token }}
      REVIEW_ACTION_ID: ${{ inputs.action_id }}
      REVIEW_WINDOW_URL: ${{ vars.REVIEW_WINDOW_URL }}
      REVIEW_WINDOW_SECRET: ${{ secrets.REVIEW_WINDOW_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Which decision is this
        id: review
        run: python -m suresilly.run describe

      - name: Restore the exact post you saw
        if: steps.review.outputs.accepted == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.review.outputs.run_id }}
          name: review-deck
          path: posts/${{ steps.review.outputs.slug }}

      - name: Do what you asked
        id: act
        if: steps.review.outputs.accepted == 'true'
        run: python -m suresilly.run act --post "posts/${{ steps.review.outputs.slug }}"

      - name: Keep the new version for your next reply
        if: steps.act.outputs.result == 'replacement_ready'
        uses: actions/upload-artifact@v4
        with:
          name: review-deck
          path: posts/${{ steps.act.outputs.slug }}/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Put the new preview images online
        if: steps.act.outputs.result == 'replacement_ready'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.act.outputs.host_dir }}
          destination_dir: slides/${{ steps.act.outputs.slug }}/reviews/${{ steps.act.outputs.review_token }}
          keep_files: true
          cname: media.suresilly.com

      - name: Send the new preview
        id: register
        if: steps.act.outputs.result == 'replacement_ready'
        run: python -m suresilly.run register --post "posts/${{ steps.act.outputs.slug }}"

      - name: Close the old preview
        if: steps.act.outputs.result == 'replacement_ready'
        run: python -m suresilly.run finish-redo

      - name: Hold an unfinished action
        if: failure() && steps.review.outputs.accepted == 'true'
        run: python -m suresilly.run fail

      - name: Save the record
        if: always() && steps.review.outputs.accepted == 'true'
        run: |
          git config user.name suresilly-bot
          git config user.email bot@suresilly.local
          git add posts state
          git diff --staged --quiet || git commit -m "review: ${{ steps.act.outputs.result || 'unfinished' }} [skip ci]"
          git pull --rebase --quiet
          git push

      - name: Tell the owner it didn't work
        if: failure()
        env:
          FAILURE_REASON: ${{ steps.act.outputs.reason || steps.register.outputs.reason || steps.review.outputs.reason }}
        run: |
          pip install --quiet requests
          python -m suresilly.run notify-failure --what "Your reply"
